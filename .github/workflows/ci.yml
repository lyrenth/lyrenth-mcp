name: CI

# Compiles the server and checks the two things that silently rot between
# releases: the version, which is declared in four places by three different
# installers, and the tool surface, which depends on which entry point was
# built. Neither is caught by `tsc`.
#
# Lives at the repo root once mirrored to github.com/lyrenth/lyrenth-mcp;
# inside the monorepo it is just a tracked file (GitHub only runs workflows
# from the repo root).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Version declarations agree
        run: node scripts/check-version.mjs

      - run: npm run build

      # Report-only here so a branch mid-change is not blocked. The release
      # workflow runs the same check with --strict, where it blocks.
      - name: Tool surface
        run: node scripts/check-tools.mjs
